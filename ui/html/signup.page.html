{{ define "title" }}Създаване на сервиз{{ end }}
{{ define "main" }}
<section class="auth-card wide-card">
	<div class="auth-card-header">
		<h1>Създайте своя сервиз</h1>
		<p class="muted">Създайте сервиз и Вашия профил на собственик.</p>
	</div>
	<form method="post" action="/account/signup" class="form-grid">
		<label class="full">Име на сервиза<input
				name="garage_name"
				value="{{ .Form.Get "garage_name" }}"
				autofocus
				required
			/>
			{{ with errorFor .Form "garage_name" }}
				<span class="field-error">{{ . }}</span>
			{{ end }}</label>
		<label>Вашето име<input
				name="name"
				value="{{ .Form.Get "name" }}"
				autocomplete="name"
				required
			/>
			{{ with errorFor .Form "name" }}
				<span class="field-error">{{ . }}</span>
			{{ end }}</label>
		<label>Имейл<input
				type="email"
				name="email"
				value="{{ .Form.Get "email" }}"
				autocomplete="email"
				required
			/>
			{{ with errorFor .Form "email" }}
				<span class="field-error">{{ . }}</span>
			{{ end }}</label>
		<label class="full">Парола<input
				type="password"
				name="password"
				autocomplete="new-password"
				minlength="8"
				required
			/><span class="hint">Трябва да съдържа поне 8 символа.</span>
			{{ with errorFor .Form "password" }}
				<span class="field-error">{{ . }}</span>
			{{ end }}</label>
		<div class="full">
			<button class="button primary wide" type="submit">Създай сервиз</button>
		</div>
	</form>
</section>
<p class="auth-switch">Вече имате акаунт? <a href="/account/login">Вход</a></p>
{{ end }}
