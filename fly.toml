app = 'pitlane-demo'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  # Docker keeps ENTRYPOINT ["/pitlane"], so Fly runs `pitlane migrate up`.
  release_command = 'migrate up'
  strategy = 'immediate'

[env]
  ENV = 'production'
  PORT = '4000'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

swap_size_mb = 512
