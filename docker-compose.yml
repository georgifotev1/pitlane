name: pitlane

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: pitlane
      POSTGRES_PASSWORD: pitlane
      POSTGRES_DB: pitlane
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitlane -d pitlane"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
