name: pitlane-prod

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: pitlane
      POSTGRES_PASSWORD: pitlane-prod-rehearsal
      POSTGRES_DB: pitlane
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitlane -d pitlane"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "4000"
      ENV: production
      DSN: postgres://pitlane:pitlane-prod-rehearsal@db:5432/pitlane?sslmode=disable
      MIGRATE_DSN: postgres://pitlane:pitlane-prod-rehearsal@db:5432/pitlane?sslmode=disable
      APP_BASE_URL: ${APP_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "4000:4000"

volumes:
  pgdata:
